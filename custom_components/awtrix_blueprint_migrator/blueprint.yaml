blueprint:
  name: AWTRIX NG Layout-App (TC002) Extended
  description: >
    Zeigt eine bis drei Entitäten als Pushed App auf einer AWTRIX NG TC002.
    Unterstützt Layouts, Prefix/Suffix, Templates, zusätzliche Trigger,
    Vor-Aktionen, freie AWTRIX-Optionen, zusätzliche Bedingungen,
    Font-Auswahl sowie 16×16-Icons mit breitem Textbereich und automatischer
    _16-Icon-Nutzung.
  domain: automation
  homeassistant:
    min_version: 2024.10.0

  input:
    basic:
      name: Grundeinstellungen
      icon: mdi:led-strip-variant
      collapsed: false
      input:
        awtrix_device:
          name: AWTRIX-Uhr(en)
          selector:
            device:
              filter:
                - integration: mqtt
                  manufacturer: Blueforcer
              multiple: true

        app_name:
          name: App-Name
          default: awtrix_app
          selector:
            text:

        layout:
          name: Layout
          default: icon_value
          selector:
            select:
              options:
                - label: "Icon + großer Wert (klassisch)"
                  value: icon_value
                - label: "16×16 Icon + breiter Wert"
                  value: icon_value_wide
                - label: "Großer Wert oben, zwei kleine unten"
                  value: big_top_two_bottom
                - label: "Name oben, Wert unten"
                  value: title_value
                - label: "Icon + zwei Zeilen"
                  value: icon_two_values

        entities:
          name: Entitäten
          description: Reihenfolge = Reihenfolge der Werte im Layout
          selector:
            entity:
              multiple: true
              reorder: true

        icon:
          name: Icon
          description: >
            AWTRIX Icon-ID oder Icon-Name. Beispiele: 52429, akku oder
            solar-panel-16x16-animated. Numerische IDs werden als String
            übertragen.
          default: ""
          selector:
            text:

        wide_icon_use_16_suffix:
          name: Beim breiten Layout automatisch _16 verwenden
          description: >
            Nur für "16×16 Icon + breiter Wert". Aktiv: 52429 -> 52429_16.
            Deaktivieren, wenn das angegebene Icon bereits ein echtes
            16×16-Icon ist und keinen _16-Suffix besitzt.
          default: true
          selector:
            boolean:

    text_options:
      name: Text & Darstellung
      icon: mdi:format-text
      collapsed: true
      input:
        prefix_text:
          name: Prefix Wert 1
          default: ""
          selector:
            text:
        suffix_text:
          name: Suffix Wert 1
          default: ""
          selector:
            text:
        prefix_text_2:
          name: Prefix Wert 2
          default: ""
          selector:
            text:
        suffix_text_2:
          name: Suffix Wert 2
          default: ""
          selector:
            text:
        prefix_text_3:
          name: Prefix Wert 3
          default: ""
          selector:
            text:
        suffix_text_3:
          name: Suffix Wert 3
          default: ""
          selector:
            text:
        color:
          name: Textfarbe
          default: []
          selector:
            color_rgb:

    font_options:
      name: Schriftart / Schriftgröße
      icon: mdi:format-font
      collapsed: true
      input:
        font_1:
          name: Schrift Wert 1
          description: >
            Bei "16×16 Icon + breiter Wert" wird bei Automatisch
            matrix-chunky8x6 verwendet.
          default: auto
          selector:
            select:
              options:
                - label: "Automatisch"
                  value: auto
                - label: "Small"
                  value: small
                - label: "Large"
                  value: large
                - label: "Matrix Light 6"
                  value: matrix-light6
                - label: "Matrix Light 6x"
                  value: matrix-light6x
                - label: "Matrix Chunky 6x"
                  value: matrix-chunky6x
                - label: "Matrix Light 8x"
                  value: matrix-light8x
                - label: "Matrix Chunky 8x6"
                  value: matrix-chunky8x6

        font_2:
          name: Schrift Wert 2
          default: auto
          selector:
            select:
              options:
                - label: "Automatisch"
                  value: auto
                - label: "Small"
                  value: small
                - label: "Large"
                  value: large
                - label: "Matrix Light 6"
                  value: matrix-light6
                - label: "Matrix Light 6x"
                  value: matrix-light6x
                - label: "Matrix Chunky 6x"
                  value: matrix-chunky6x
                - label: "Matrix Light 8x"
                  value: matrix-light8x
                - label: "Matrix Chunky 8x6"
                  value: matrix-chunky8x6

        font_3:
          name: Schrift Wert 3
          default: auto
          selector:
            select:
              options:
                - label: "Automatisch"
                  value: auto
                - label: "Small"
                  value: small
                - label: "Large"
                  value: large
                - label: "Matrix Light 6"
                  value: matrix-light6
                - label: "Matrix Light 6x"
                  value: matrix-light6x
                - label: "Matrix Chunky 6x"
                  value: matrix-chunky6x
                - label: "Matrix Light 8x"
                  value: matrix-light8x
                - label: "Matrix Chunky 8x6"
                  value: matrix-chunky8x6

        title_font:
          name: Schrift Titel
          default: auto
          selector:
            select:
              options:
                - label: "Automatisch"
                  value: auto
                - label: "Small"
                  value: small
                - label: "Large"
                  value: large
                - label: "Matrix Light 6"
                  value: matrix-light6
                - label: "Matrix Light 6x"
                  value: matrix-light6x
                - label: "Matrix Chunky 6x"
                  value: matrix-chunky6x
                - label: "Matrix Light 8x"
                  value: matrix-light8x
                - label: "Matrix Chunky 8x6"
                  value: matrix-chunky8x6

    templates:
      name: Templates
      icon: mdi:code-braces
      collapsed: true
      input:
        value_template:
          name: Template für Wert 1
          default: ""
          selector:
            template:
        value_template_2:
          name: Template für Wert 2
          default: ""
          selector:
            template:
        value_template_3:
          name: Template für Wert 3
          default: ""
          selector:
            template:
        icon_template:
          name: Icon-Template
          default: ""
          selector:
            template:
        title_template:
          name: Titel-Template
          default: ""
          selector:
            template:

    automation_options:
      name: Trigger, Aktionen & Bedingungen
      icon: mdi:source-branch
      collapsed: true
      input:
        periodic_refresh:
          name: Alle 5 Minuten aktualisieren
          description: Sendet die App zusätzlich alle 5 Minuten erneut.
          default: true
          selector:
            boolean: {}
        extra_triggers:
          name: Zusätzliche Trigger
          description: >
            Zusätzliche Trigger für die Aktualisierung. Bei Bedingungen sollte
            die zustandsgebende Entität hier ebenfalls als Trigger stehen.
          default: []
          selector:
            trigger: {}
        pre_actions:
          name: Vor-Aktionen
          default: []
          selector:
            action: {}
        additional_conditions:
          name: Zusätzliche Bedingungen
          description: Die App wird nur angezeigt, wenn alle Bedingungen erfüllt sind.
          default: []
          selector:
            condition: {}
        remove_when_conditions_false:
          name: App entfernen, wenn Bedingungen nicht erfüllt sind
          default: true
          selector:
            boolean: {}

    awtrix_options_section:
      name: Erweiterte AWTRIX-Optionen
      icon: mdi:tune-variant
      collapsed: true
      input:
        user_options:
          name: AWTRIX App-Optionen
          description: >
            Zusätzliche AWTRIX-NG Optionen. Altes "duration: 5" wird intern
            zu "durationMs: 5000" konvertiert.
          default: {}
          selector:
            object: {}

mode: restart
max_exceeded: silent

variables:
  device_ids: !input awtrix_device
  app_name_raw: !input app_name
  layout: !input layout
  ents: !input entities
  icon_input: !input icon
  wide_icon_suffix_enabled: !input wide_icon_use_16_suffix
  color: !input color
  prefix_1: !input prefix_text
  suffix_1: !input suffix_text
  prefix_2: !input prefix_text_2
  suffix_2: !input suffix_text_2
  prefix_3: !input prefix_text_3
  suffix_3: !input suffix_text_3
  font_1_input: !input font_1
  font_2_input: !input font_2
  font_3_input: !input font_3
  title_font_input: !input title_font
  periodic_refresh_enabled: !input periodic_refresh
  remove_when_false: !input remove_when_conditions_false
  user_options_input: !input user_options

  availability_topics: >-
    {% set ns = namespace(out=[]) %}
    {% for dev in device_ids %}
      {% set pe = device_entities(dev) | select('search', 'mqtt_prefix') | first | default('') %}
      {% set p = states(pe) if pe else '' %}
      {% if p not in ['', 'unknown', 'unavailable', 'none'] %}
        {% set ns.out = ns.out + [p ~ '/availability'] %}
      {% endif %}
    {% endfor %}
    {{ ns.out }}

triggers:
  - trigger: state
    entity_id: !input entities
    id: __awtrix_entity_update
  - trigger: homeassistant
    event: start
    id: __awtrix_ha_start
  - trigger: event
    event_type: automation_reloaded
    id: __awtrix_automation_reloaded
  - trigger: time_pattern
    minutes: "/5"
    id: __awtrix_periodic
  - trigger: mqtt
    topic: "+/availability"
    payload: "online"
    id: __awtrix_online
  - triggers: !input extra_triggers

conditions: []

actions:
  - variables:
      safe_app_name: >-
        {% set name =
          app_name_raw
          | string
          | lower
          | replace('ä', 'ae')
          | replace('ö', 'oe')
          | replace('ü', 'ue')
          | replace('ß', 'ss')
          | regex_replace('\s+', '')
          | regex_replace('[^a-z0-9_-]', '')
        %}
        {{ name[:32] if name else 'awtrixapp' }}

  - condition: template
    value_template: >-
      {% if trigger is not defined or trigger is none %}
        true
      {% elif trigger.id | default('') == '__awtrix_periodic' %}
        {{ periodic_refresh_enabled }}
      {% else %}
        true
      {% endif %}

  - choose: []
    default: !input pre_actions

  - variables:
      entity_id: >-
        {{ ents[0] if ents | count > 0 else '' }}
      entity_id_2: >-
        {{ ents[1] if ents | count > 1 else '' }}
      entity_id_3: >-
        {{ ents[2] if ents | count > 2 else '' }}

  - variables:
      custom_value_1: !input value_template
      custom_value_2: !input value_template_2
      custom_value_3: !input value_template_3
      custom_icon: !input icon_template
      custom_title: !input title_template

  - variables:
      value_1: >-
        {% if custom_value_1 | string | trim %}
          {{ prefix_1 ~ (custom_value_1 | string) ~ suffix_1 }}
        {% elif entity_id %}
          {% if states(entity_id) in ['unknown', 'unavailable'] %}
            {{ prefix_1 ~ '--' ~ suffix_1 }}
          {% elif suffix_1 | string | trim %}
            {{ prefix_1 ~ states(entity_id, rounded=True) ~ suffix_1 }}
          {% else %}
            {{ prefix_1 ~ states(entity_id, rounded=True, with_unit=True) }}
          {% endif %}
        {% else %}
          --
        {% endif %}

      value_2: >-
        {% if custom_value_2 | string | trim %}
          {{ prefix_2 ~ (custom_value_2 | string) ~ suffix_2 }}
        {% elif entity_id_2 %}
          {% if states(entity_id_2) in ['unknown', 'unavailable'] %}
            {{ prefix_2 ~ '--' ~ suffix_2 }}
          {% elif suffix_2 | string | trim %}
            {{ prefix_2 ~ states(entity_id_2, rounded=True) ~ suffix_2 }}
          {% else %}
            {{ prefix_2 ~ states(entity_id_2, rounded=True, with_unit=True) }}
          {% endif %}
        {% else %}
          --
        {% endif %}

      value_3: >-
        {% if custom_value_3 | string | trim %}
          {{ prefix_3 ~ (custom_value_3 | string) ~ suffix_3 }}
        {% elif entity_id_3 %}
          {% if states(entity_id_3) in ['unknown', 'unavailable'] %}
            {{ prefix_3 ~ '--' ~ suffix_3 }}
          {% elif suffix_3 | string | trim %}
            {{ prefix_3 ~ states(entity_id_3, rounded=True) ~ suffix_3 }}
          {% else %}
            {{ prefix_3 ~ states(entity_id_3, rounded=True, with_unit=True) }}
          {% endif %}
        {% else %}
          --
        {% endif %}

      icon_final: >-
        {{ custom_icon if custom_icon | string | trim else icon_input }}

      title_1: >-
        {% if custom_title | string | trim %}
          {{ custom_title }}
        {% elif entity_id %}
          {{ state_attr(entity_id, 'friendly_name') or entity_id }}
        {% else %}
          --
        {% endif %}

      normalized_user_options: >-
        {% set opts = dict(user_options_input.items() | rejectattr(0, 'equalto', 'duration') | list) %}
        {% if user_options_input.get('duration') is not none and user_options_input.get('durationMs') is none %}
          {% set opts = dict(opts, durationMs=((user_options_input.get('duration') | float) * 1000) | int) %}
        {% endif %}
        {{ opts }}

  - variables:
      layouts:
        icon_value_wide:
          - id: icon
            box: [0, 0, 16, 16]
            icon_region: true
            align: center
            valign: center
          - id: value
            box: [18, 0, 34, 16]
            slot: 0
            font: matrix-chunky8x6
            align: center
            valign: center

        big_top_two_bottom:
          - id: main
            box: [0, 0, 52, 8]
            slot: 0
            font: matrix-chunky8x6
          - id: left
            box: [0, 9, 25, 7]
            slot: 1
            font: matrix-light6
          - id: right
            box: [27, 9, 25, 7]
            slot: 2
            font: matrix-light6

        title_value:
          - id: title
            box: [0, 0, 52, 8]
            show: title
            font: matrix-light6
          - id: value
            box: [0, 8, 52, 8]
            slot: 0
            font: matrix-chunky8x6

        icon_two_values:
          - id: icon
            box: [0, 0, 16, 16]
            icon_region: true
            align: center
            valign: center
          - id: top
            box: [18, 0, 34, 8]
            slot: 0
            font: matrix-light6
          - id: bottom
            box: [18, 8, 34, 8]
            slot: 1
            font: matrix-light6


  - repeat:
      for_each: "{{ device_ids }}"
      sequence:
        - variables:
            prefix_entity: >-
              {{ device_entities(repeat.item) | select('search', 'mqtt_prefix') | first | default('') }}
            awtrix_prefix: >-
              {{ states(prefix_entity) if prefix_entity else '' }}

        - choose:
            - conditions:
                - condition: template
                  value_template: >-
                    {{ awtrix_prefix not in ['', 'unknown', 'unavailable', 'none'] }}
                - condition: template
                  value_template: >-
                    {% if trigger is not defined or trigger is none %}
                      true
                    {% elif trigger.id | default('') == '__awtrix_online' %}
                      {{ trigger.topic | default('') == awtrix_prefix ~ '/availability' }}
                    {% else %}
                      true
                    {% endif %}
              sequence:
                - if: !input additional_conditions
                  then:
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ layout == 'icon_value' }}"
                          sequence:
                            - action: mqtt.publish
                              data:
                                topic: "{{ awtrix_prefix ~ '/cmd/apps/pushed/' ~ safe_app_name }}"
                                payload: >-
                                  {% set selected_icon = custom_icon if custom_icon | string | trim else icon_input %}
                                  {% set safe_icon = selected_icon | string | trim | replace('\\', '\\\\') | replace('"', '\\"') %}
                                  {% set safe_text = value_1 | string | replace('\\', '\\\\') | replace('"', '\\"') %}
                                  {
                                  {% for key, val in normalized_user_options.items() %}
                                  {{ key | to_json }}:{{ val | to_json }},
                                  {% endfor %}
                                  "text":"{{ safe_text }}"
                                  {% if safe_icon %},"icon":"{{ safe_icon }}"{% endif %}
                                  {% if font_1_input != 'auto' %},"font":{{ font_1_input | to_json }}{% endif %}
                                  {% if color %},"textColor":{{ color | to_json }}{% endif %}
                                  }
                      default:
                        - action: mqtt.publish
                          data:
                            topic: "{{ awtrix_prefix ~ '/cmd/apps/pushed/' ~ safe_app_name }}"
                            payload: >-
                              {% set selected_icon = custom_icon if custom_icon | string | trim else icon_input %}
                              {% set safe_icon = selected_icon | string | trim | replace('\\', '\\\\') | replace('"', '\\"') %}

                              {% set layout_icon = safe_icon %}
                              {% if layout == 'icon_value_wide' and wide_icon_suffix_enabled and safe_icon %}
                                {% if '://' in safe_icon %}
                                  {% set layout_icon = safe_icon %}
                                {% else %}
                                  {% set icon_base = safe_icon | regex_replace('\.(gif|jpg|jpeg)$', '') %}
                                  {% if icon_base[-3:] == '_16' %}
                                    {% set layout_icon = icon_base %}
                                  {% else %}
                                    {% set layout_icon = icon_base ~ '_16' %}
                                  {% endif %}
                                {% endif %}
                              {% endif %}

                              {% set vals = [value_1, value_2, value_3] %}
                              {% set selected_fonts = [font_1_input, font_2_input, font_3_input] %}

                              {
                              {% for key, val in normalized_user_options.items() %}
                              {{ key | to_json }}:{{ val | to_json }},
                              {% endfor %}
                              "layout": {
                                "version": 1,
                                "regions": [
                                  {% set ns = namespace(first=true) %}
                                  {% if layout in layouts %}
                                    {% for r in layouts[layout] %}

                                      {% if r.icon_region is defined %}
                                        {% if layout_icon %}
                                          {% if not ns.first %},{% endif %}
                                          {
                                            "id":{{ r.id | to_json }},
                                            "box":{{ r.box | to_json }},
                                            "icon":"{{ layout_icon }}"
                                            {% if r.align is defined %},"align":{{ r.align | to_json }}{% endif %}
                                            {% if r.valign is defined %},"valign":{{ r.valign | to_json }}{% endif %}
                                          }
                                          {% set ns.first = false %}
                                        {% endif %}

                                      {% elif r.show | default('') == 'title' %}
                                        {% set effective_title_font = title_font_input if title_font_input != 'auto' else r.font | default('') %}
                                        {% if not ns.first %},{% endif %}
                                        {
                                          "id":{{ r.id | to_json }},
                                          "box":{{ r.box | to_json }},
                                          "text":{{ title_1 | string | to_json }}
                                          {% if effective_title_font %},"font":{{ effective_title_font | to_json }}{% endif %}
                                          {% if r.align is defined %},"align":{{ r.align | to_json }}{% endif %}
                                          {% if r.valign is defined %},"valign":{{ r.valign | to_json }}{% endif %}
                                          {% if color %},"color":{{ color | to_json }}{% endif %}
                                        }
                                        {% set ns.first = false %}

                                      {% elif r.slot is defined and r.slot < ents | count %}
                                        {% set selected_font = selected_fonts[r.slot] %}
                                        {% set effective_font = selected_font if selected_font != 'auto' else r.font | default('') %}
                                        {% if not ns.first %},{% endif %}
                                        {
                                          "id":{{ r.id | to_json }},
                                          "box":{{ r.box | to_json }},
                                          "text":{{ vals[r.slot] | string | to_json }}
                                          {% if effective_font %},"font":{{ effective_font | to_json }}{% endif %}
                                          {% if r.align is defined %},"align":{{ r.align | to_json }}{% endif %}
                                          {% if r.valign is defined %},"valign":{{ r.valign | to_json }}{% endif %}
                                          {% if color %},"color":{{ color | to_json }}{% endif %}
                                        }
                                        {% set ns.first = false %}
                                      {% endif %}

                                    {% endfor %}
                                  {% endif %}
                                ]
                              }
                              }
                  else:
                    - if:
                        - condition: template
                          value_template: "{{ remove_when_false }}"
                      then:
                        - action: mqtt.publish
                          data:
                            topic: "{{ awtrix_prefix ~ '/cmd/apps/pushed/' ~ safe_app_name }}"
                            payload: ""
